name = "deepmemo-pdf"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Browser Rendering API binding
browser = { binding = "BROWSER" }

# KV namespace for rate limiting
# Create with: wrangler kv:namespace create "RATE_LIMIT"
[[kv_namespaces]]
binding = "RATE_LIMIT"
id = "2a8c4c0dea144f0c9ad72ee95a497eb9"  # deepmemo-pdf-rate-limit (namespace lié au worker en prod)

# Usage stats (Workers Analytics Engine, free plan: 100k writes/day)
[[analytics_engine_datasets]]
binding = "STATS"
dataset = "deepmemo_pdf"

# Custom domain (optional, configure in CloudFlare dashboard)
# routes = [
#   { pattern = "pdf.deepmemo.org/*", zone_name = "deepmemo.org" }
# ]

# Deployment
[build]
command = ""  # No build step needed

[env.production]
name = "deepmemo-pdf"
