name = "deepmemo-pdf"
main = "worker.js"
compatibility_date = "2024-01-01"

# Browser Rendering API binding
browser = { binding = "BROWSER" }

# KV namespace for rate limiting
# Create with: wrangler kv:namespace create "RATE_LIMIT"
[[kv_namespaces]]
binding = "RATE_LIMIT"
# id = "your_kv_namespace_id_here"  # Add after creating namespace

# Custom domain (optional, configure in CloudFlare dashboard)
# routes = [
#   { pattern = "pdf.deepmemo.org/*", zone_name = "deepmemo.org" }
# ]

# Deployment
[build]
command = ""  # No build step needed

[env.production]
name = "deepmemo-pdf"
